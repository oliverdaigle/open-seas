# Listens to AIS for 10 minutes out of every 15, collects weather, and deploys the site to GitHub Pages.
# Ship positions need a repository secret named AISSTREAM_API_KEY (free at https://aisstream.io).
name: Live data

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_weather:
        description: Refresh the weather grids even if they are recent
        type: boolean
        default: false
      debug_ais:
        description: Log every passenger vessel AIS hears
        type: boolean
        default: false

permissions:
  contents: write   # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Collect live data
        continue-on-error: true
        run: node tools/collect.mjs
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE_WEATHER: ${{ inputs.force_weather && '1' || '' }}
          DEBUG_AIS: ${{ inputs.debug_ais && '1' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without a commit. This keeps it running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the live-data schedule running"
            git push
          fi
